<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Zavala Tech Consulting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--esp:#241c17;--cream:#f6f0e7;--terra:#bf5e39;--terra-soft:#e3a583;--muted:#b9ac9d;--line:#43382f;
      --serif:'Newsreader',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
    body{background:var(--esp);color:var(--cream);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    nav{padding:22px 44px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
    .mark{width:36px;height:36px;border:1.5px solid var(--cream);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
    .mark i{color:var(--terra);font-style:normal}
    .word{font-family:var(--serif);font-size:21px;font-weight:500;text-decoration:none;color:var(--cream)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:4rem 2rem}
    .term{width:100%;max-width:620px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#1d1611}
    .bar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:12px;color:#8a7d6f}
    .dot{width:11px;height:11px;border-radius:50%}
    .bar .t{margin-left:10px}
    .body{padding:30px 28px 36px;font-size:14.5px;line-height:2}
    .body .p{color:#6fcf97}.body .f{color:var(--terra-soft)}
    .err{color:var(--terra-soft)}
    .code{font-family:var(--serif);font-size:clamp(4rem,14vw,7rem);line-height:1;color:var(--terra);letter-spacing:-.03em;margin:14px 0 4px}
    .msg{color:var(--muted);font-size:14px;margin-bottom:24px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
    .btn{display:inline-block;padding:12px 22px;border-radius:24px;font-size:13.5px;font-weight:500;text-decoration:none;transition:all .18s}
    .btn-primary{background:var(--terra);color:#fff}
    .btn-primary:hover{background:#a94e2c}
    .btn-ghost{border:1px solid var(--line);color:var(--cream)}
    .btn-ghost:hover{border-color:var(--terra-soft);color:var(--terra-soft)}
    .cur{display:inline-block;width:8px;height:14px;background:var(--terra);vertical-align:-2px;margin-left:3px;animation:b 1.1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
    footer{text-align:center;padding:1.5rem 2rem;font-size:12px;color:#6d6256;border-top:1px solid var(--line)}
  </style>
</head>
<body>
  <nav>
    <a href="/" class="word" style="display:flex;align-items:center;gap:12px">
      <span class="mark">z<i>t</i></span>Zavala&nbsp;Tech
    </a>
  </nav>

  <main>
    <div class="term">
      <div class="bar">
        <span class="dot" style="background:#ec6a5e"></span>
        <span class="dot" style="background:#f4bf4f"></span>
        <span class="dot" style="background:#61c554"></span>
        <span class="t">zt@colorado: ~</span>
      </div>
      <div class="body">
        <div><span class="p">➜</span> <span class="f">~</span> cd <span class="err" id="path">this-page</span></div>
        <div class="err">bash: cd: <span id="path2">this-page</span>: No such file or directory</div>
        <div class="code">404</div>
        <div class="msg"># this page doesn't exist or was moved. let's get you back on track.</div>
        <div class="actions">
          <a href="/" class="btn btn-primary">← back to home</a>
          <a href="/#contact" class="btn btn-ghost">$ get in touch</a>
        </div>
        <div style="margin-top:18px;color:#6fcf97"><span class="p">➜</span> <span class="f">~</span><span class="cur"></span></div>
      </div>
    </div>
  </main>

  <footer>&copy; <script>document.write(new Date().getFullYear())</script> Chris Zavala · Colorado</footer>

  <script>
    try {
      var p = location.pathname.replace(/^\//,'') || 'this-page';
      document.getElementById('path').textContent = p;
      document.getElementById('path2').textContent = p;
    } catch (e) {}
  </script>
</body>
</html>
