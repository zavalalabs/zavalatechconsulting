<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found | Zavala Tech Consulting</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                   Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid rgba(45, 212, 191, 0.15);
    }

    .nav-brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f0f6fc;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-brand span {
      color: #2dd4bf;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    .error-container {
      text-align: center;
      max-width: 540px;
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 9rem);
      font-weight: 800;
      color: #2dd4bf;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .error-heading {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      color: #f0f6fc;
      margin-top: 1rem;
    }

    .error-message {
      font-size: 1.05rem;
      color: #8b949e;
      margin-top: 0.75rem;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-primary {
      background-color: #2dd4bf;
      color: #0d1117;
    }

    .btn-secondary {
      background-color: transparent;
      color: #2dd4bf;
      border: 1.5px solid #2dd4bf;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: 0.85rem;
      color: #484f58;
      border-top: 1px solid rgba(45, 212, 191, 0.1);
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-brand">Zavala <span>Tech</span></a>
  </nav>

  <main>
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-heading">Page not found</h1>
      <p class="error-message">
        This page doesn't exist or was moved. Let's get you back on track.
      </p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">&larr; Back to home</a>
        <a href="/#contact" class="btn btn-secondary">Get in touch</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> Zavala Tech Consulting. All rights reserved.
  </footer>

</body>
</html>
